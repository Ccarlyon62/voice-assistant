name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libltdl-dev \
            libtool \
            autoconf \
            automake \
            gettext \
            zlib1g-dev \
            libncurses5-dev \
            libstdc++6 \
            libglu1-mesa-dev \
            libgl1-mesa-dev \
            unzip \
            ant

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v0.4f
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        with:
          filename: buildozer.spec
          release: false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: bin/*.apk
