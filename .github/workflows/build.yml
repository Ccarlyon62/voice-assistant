name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip patch python3-pip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev lld python3-setuptools

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer "cython<3.0.0"

      - name: Set up Android SDK & Install Components
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          cd "$SDK_DIR/cmdline-tools"
          
          curl -sS -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip
          mv cmdline-tools latest
          rm commandlinetools.zip

          # Legacy symlink for python-for-android
          mkdir -p "$SDK_DIR/tools"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin" "$SDK_DIR/tools/bin"

          # Export local paths for this step
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"

          # Accept licenses and install platform-tools, build-tools, and platform API
          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses
          yes | sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: "/home/runner/.buildozer/android/platform/android-sdk"
          ANDROID_SDK_ROOT: "/home/runner/.buildozer/android/platform/android-sdk"
        run: |
          buildozer -v android debug --default

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-Debug-APK
          path: bin/*.apk
